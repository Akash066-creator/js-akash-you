<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="background-color: #212121; color : white;">
0	UNSENT : Client has been created. open() not called yet.
1	OPENED : open() has been called.
2	HEADERS_RECEIVED : send() has been called, and headers and status are available.
3	LOADING : Downloading; responseText holds partial data.
4	DONE : The operation is complete.
<div class="card">
    <div id="follower"></div>
    <div id="image"><img scr="" alt="not"></div>
</div>
</body>
<script>
    const requestUrl  = "https://api.github.com/users/Akash066-creator"
    const xhr = new XMLHttpRequest();
    
    xhr.open('GET',requestUrl);
    xhr.onreadystatechange = function(){
        console.log(xhr.readyState);
        if(xhr.readyState === 4){
            const data = JSON.parse(this.responseText);
            const follower = document.querySelector('#follower');
            const profileImage = document.querySelector('#image img');
            follower.innerHTML = data.followers;
            profileImage.src = "https://avatars.githubusercontent.com/u/257103602?v=4";
        }
    }
    xhr.send();
</script>
</html>
