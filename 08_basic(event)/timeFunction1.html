<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time function</title>
    <script type="module" src="script.js"></script>
</head>
<body>
    <h1>chai aur code</h1>
    <button id="stop">stop</button>
</body>
<script>
    const sayAkash = function(){
    console.log("hi Akash");
} 
const changeText = function(){
    document.querySelector('h1').innerHTML = "javascript tutorial";
}
setTimeout(sayAkash,2000);
// setTimeout(changeText,2000);

// const changeMe = setTimeout(changeText,2000);
// clearTimeout(changeMe);

// i want to apply it over an event that is when event is triggered then this cleareTimeout call otherwise not

const changeMe = setTimeout(changeText,2000);
document.querySelector('#stop').addEventListener('click',function(e){
        clearTimeout(changeMe);
});


</script>
</html>
